[versions]
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
# Версии подобраны под AGP 8.13.2 / compileSdk 36:
# core-ktx 1.19 и lifecycle 2.11 требуют AGP 9.1 и compileSdk 37.
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
