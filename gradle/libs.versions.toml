hilt = "2.57.1"
camerax = "1.6.1"
mlkitTextRecognition = "16.0.1"
room = "2.6.1"
matheclipse = "3.2.0"
ktor = "2.3.13"
kotlinxSerializationJson = "1.7.3"
logback = "1.5.18"
firebaseAuth = "23.2.1"
credentials = "1.3.0"
googleid = "1.1.1"
yandexAuthSdk = "3.1.3"
googleServices = "4.4.4"
playBilling = "9.1.0"

